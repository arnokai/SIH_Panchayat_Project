# ============================================================
# TerraMind Advisory Rule Engine
# Prototype rules based on the SIH handbook.
#
# IMPORTANT:
# Thresholds/actions are prototype values and require review
# by an agriculture faculty member / KVK scientist before
# being described as agriculturally validated.
# ============================================================

rules:

  # ----------------------------------------------------------
  # 1. HEAVY RAIN
  # Handbook scenario:
  # Rain > 20 mm expected in next 48 h
  # ----------------------------------------------------------

  - id: no_spray_rain

    crop:
      - paddy
      - vegetables
      - potato
      - mustard
      - jute

    condition: "rain_mm > 20"

    priority: high
    type: warning

    text_en: "Do not spray. Do not apply urea. Open field drains."



  # ----------------------------------------------------------
  # 2. HEAT STRESS DURING FLOWERING
  # Handbook scenario:
  # Max temperature > 38 °C during flowering
  # ----------------------------------------------------------

  - id: heat_stress

    crop:
      - paddy

    stage:
      - flowering

    condition: "tmax_c > 38"

    priority: high
    type: warning

    text_en: "Heat stress risk. Irrigate in the early morning."



  # ----------------------------------------------------------
  # 3. HIGH HUMIDITY / BLAST RISK
  # Handbook scenario:
  # Humidity > 85% for 3 days on paddy
  # ----------------------------------------------------------

  - id: blast_disease_risk

    crop:
      - paddy

    condition: "humidity > 85 and humidity_days >= 3"

    priority: high
    type: warning

    text_en: "Blast disease risk. Inspect leaves today."



  # ----------------------------------------------------------
  # 4. DRY SPELL ON SANDY SOIL
  # Handbook scenario:
  # No rain for 7 days on sandy soil
  # ----------------------------------------------------------

  - id: sandy_soil_dry_spell

    crop:
      - all

    soil:
      - sandy

    condition: "dry_days >= 7"

    priority: medium
    type: warning

    text_en: "Dry spell detected. Irrigate within two days."



  # ----------------------------------------------------------
  # 5. RAIN DURING HARVEST
  # Handbook scenario:
  # Rain expected during harvest window
  # ----------------------------------------------------------

  - id: harvest_rain

    crop:
      - all

    stage:
      - harvest

    condition: "rain_mm > 0"

    priority: high
    type: warning

    text_en: "Rain expected during harvest window. Advance harvest. Arrange covered storage."



  # ----------------------------------------------------------
  # 6. PROJECT EXTENSION — MODERATE RAIN
  #
  # Added because the current forecast range 5–20 mm otherwise
  # has no matching rainfall rule.
  # ----------------------------------------------------------

  - id: moderate_rain

    crop:
      - all

    condition: "rain_mm > 5 and rain_mm <= 20"

    priority: medium
    type: warning

    text_en: "Moderate rain expected. Monitor field drainage and avoid unnecessary field operations."



  # ----------------------------------------------------------
  # 7. LIGHT RAIN
  # Existing TerraMind prototype rule
  # ----------------------------------------------------------

  - id: light_rain

    crop:
      - all

    condition: "rain_mm > 0 and rain_mm <= 5"

    priority: low
    type: success

    text_en: "Light rain. Safe to apply light fertilisers."



  # ----------------------------------------------------------
  # 8. NO RAIN
  # Existing TerraMind prototype rule
  # ----------------------------------------------------------

  - id: dry_day

    crop:
      - all

    condition: "rain_mm == 0"

    priority: low
    type: info

    text_en: "No rain expected. Maintain normal irrigation schedule."



  # ----------------------------------------------------------
  # 9. CHEMICAL SPRAY SAFE WINDOW
  # ----------------------------------------------------------

  - id: chemical_spray_safe_window

    crop:
      - all

    condition: "rain_mm == 0 and tmax_c <= 34 and tmax_c >= 20"

    priority: low
    type: advisory

    text_en: "Safe chemical spray window: Morning hours (07:00 - 10:30 AM). Zero wash-off risk."



  # ----------------------------------------------------------
  # 10. SHEATH BLIGHT RISK
  # ----------------------------------------------------------

  - id: sheath_blight_risk

    crop:
      - paddy

    condition: "humidity > 80 and humidity_days >= 2 and tmax_c >= 28"

    priority: medium
    type: warning

    text_en: "Favorable conditions for Sheath Blight. Inspect lower leaf sheaths; avoid excessive nitrogen."



  # ----------------------------------------------------------
  # 11. POTATO LATE BLIGHT (Phytophthora infestans)
  # ----------------------------------------------------------

  - id: potato_late_blight

    crop:
      - potato

    condition: "humidity > 82 and tmax_c <= 25 and tmax_c >= 12"

    priority: high
    type: warning

    text_en: "Late Blight weather warning. High humidity and cool temperatures favor Phytophthora blight. Apply prophylactic Mancozeb spray."



  # ----------------------------------------------------------
  # 12. POTATO WATERLOGGING & DRAINAGE
  # ----------------------------------------------------------

  - id: potato_waterlogging_risk

    crop:
      - potato

    condition: "rain_mm > 15"

    priority: high
    type: warning

    text_en: "Excess moisture alert for potato crop. Clear furrow drains immediately to prevent tuber rotting and soil compaction."



  # ----------------------------------------------------------
  # 13. MUSTARD APHID & WHITE RUST RISK
  # ----------------------------------------------------------

  - id: mustard_aphid_rust_risk

    crop:
      - mustard

    condition: "humidity > 75 and tmax_c >= 15 and tmax_c <= 26"

    priority: medium
    type: warning

    text_en: "Favorable weather for Mustard Aphid and White Rust. Inspect inflorescence, flower buds, and lower leaves."



  # ----------------------------------------------------------
  # 14. JUTE STEM ROT & DRAINAGE
  # ----------------------------------------------------------

  - id: jute_stem_rot

    crop:
      - jute

    condition: "rain_mm > 20 and humidity > 80"

    priority: high
    type: warning

    text_en: "Water stagnation alert for Jute. Drain excess water promptly to prevent Macrophomina stem and root rot."



  # ----------------------------------------------------------
  # 15. PADDY BROWN PLANT HOPPER (BPH) ALERT
  # ----------------------------------------------------------

  - id: paddy_bph_risk

    crop:
      - paddy

    condition: "humidity > 80 and tmax_c >= 28 and tmax_c <= 34 and dry_days >= 3"

    priority: medium
    type: warning

    text_en: "Microclimate favorable for Brown Plant Hopper (BPH). Check base of rice tillers just above water level."